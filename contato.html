

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contato - Ateliê de Costura</title>

    <link rel="stylesheet" href="contato.css">
    <link rel="stylesheet" href="responsivo.css">
</head>

<body>

    <header>

        <h1>Ateliê de Costura</h1>

        <nav>
            <a href="costureira.html">Início</a>
            <a href="servicos.html">Serviços</a>
            <a href="galeria.html">Galeria</a>
            <a href="contato.html">Contato</a>
        </nav>

    </header>


    <main>

        <section class="contato">

            <h2>Entre em contato</h2>

            <p>
                Tem alguma dúvida ou deseja solicitar um serviço?
                Preencha seus dados abaixo.
            </p>


            <form>

                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome">


                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" placeholder="(00) 00000-0000">


                <label for="servico">Qual serviço você deseja?</label>

                <select id="servico">

                    <option>Selecione um serviço</option>
                    <option>Ajuste de roupas</option>
                    <option>Conserto de roupas</option>
                    <option>Confecção de roupas</option>
                    <option>Troca de zíper</option>
                    <option>Confecção de vestidos</option>
                    <option>Outro</option>

                </select>


                <label for="mensagem">Mensagem:</label>

                <textarea id="mensagem" rows="5"
                    placeholder="Conte um pouco sobre o que você precisa..."></textarea>


                <button type="submit">Enviar mensagem</button>

            </form>

        </section>


        <section class="informacoes">

            <h2>Fale conosco</h2>

            <p>📱 WhatsApp: (00) 00000-0000</p>

            <p>📍 Localização: Sua cidade - MG</p>

            <p>🕐 Horário: Segunda a sexta, 08:00 às 18:00</p>

        </section>

    </main>

</body>

</html>


</header>
 
</body>
</html>
